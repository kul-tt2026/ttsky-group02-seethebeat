name: lint

on:
  push:
  workflow_dispatch:

jobs:
  verilator-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint RTL
        run: make lint

  golden-model:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Python golden-model self-checks
        run: |
          python model/test_cordic.py
          python model/test_butterfly.py
          python model/test_fft_ref.py
          python model/test_mcu_bus_model.py
          python model/test_spectrum_ref.py
          python model/test_vga_ref.py
          python model/test_visual_ref.py
          python model/test_geometry_sync.py

  rtl-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: RTL blocks vs Python models (bit-exact)
        run: |
          cd test_units
          for B in cordic mcu_bus fft_ctrl fft_alu vga_timing visual_state pixel_gen; do
            echo "=== unit test: $B ==="
            make BLOCK=$B
            # make returns success even if the test fails; check results.xml
            ! grep '<failure' results.xml
            make clean BLOCK=$B
          done

      - name: Full-size FFT (N=512) -- exercises the whole 10-bit bus address space
        run: |
          cd test_units
          # The LOGN=6 run above never drives addr[9] (word addresses only reach 2N-1),
          # so a dropped address MSB would pass unnoticed. This run is the real chip size.
          make BLOCK=fft_ctrl FFT_LOGN=9
          ! grep '<failure' results.xml
          make clean BLOCK=fft_ctrl
